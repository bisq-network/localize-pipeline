name: "Localize Pipeline"
description: >-
  AI localization for Java .properties and JSON files, with reviewable GitHub
  pull requests.

branding:
  icon: globe
  color: blue

inputs:
  config-file:
    description: "Path to the translation config in your repo (see config.example.yaml or run localize init)."
    required: false
    default: "config.yaml"
  openai-api-key:
    description: "OpenAI API key. Leave empty when using a local endpoint (Ollama) via api-base-url."
    required: false
    default: ""
  api-base-url:
    description: "OpenAI-compatible endpoint, e.g. http://localhost:11434/v1 for Ollama. Overrides config."
    required: false
    default: ""
  review-model:
    description: "Override the holistic-review model (maps to REVIEW_MODEL_NAME)."
    required: false
    default: ""
  plugin-modules:
    description: "Comma-separated localize plugin modules to import before check/run."
    required: false
    default: ""
  plugin-install-command:
    description: "Optional shell command to install custom adapter packages before check/run."
    required: false
    default: ""
  diff-base:
    description: >-
      Git ref to detect changed source strings against (e.g. the push/PR base). The
      pipeline translates only keys changed since this ref. Defaults to the push base.
    required: false
    default: ${{ github.event.before }}
  process-all-files:
    description: >-
      Translate ALL locale files instead of only those changed since diff-base. Use
      sparingly for a controlled backfill; leave false for normal incremental CI.
    required: false
    default: "false"
  dry-run:
    description: "Run discovery and validation without model calls or translation writes."
    required: false
    default: "false"
  open-pr:
    description: "Open a pull request with the translations (true) or just leave the changes (false)."
    required: false
    default: "true"
  pr-branch:
    description: "Branch to push the translations to."
    required: false
    default: "ai-translations"
  pr-title:
    description: "Title of the pull request."
    required: false
    default: "Update AI translations"
  commit-message:
    description: "Commit message for the translation changes."
    required: false
    default: "Update AI translations"
  git-user-name:
    description: "Git user.name used for generated translation commits."
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: "Git user.email used for generated translation commits."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  commit-signing-method:
    description: "Commit signing method. Use 'ssh' with commit-signing-key, or 'none' for unsigned commits."
    required: false
    default: "none"
  commit-signing-key:
    description: "Private SSH signing key used when commit-signing-method is 'ssh'. Store this as a secret."
    required: false
    default: ""
  github-token:
    description: "Token used to push the branch and open the PR."
    required: false
    default: ${{ github.token }}
  python-version:
    description: "Python version to run the pipeline with."
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Validate workflow context
      shell: bash
      env:
        LOCALIZE_OPEN_PR: ${{ inputs.open-pr }}
        LOCALIZE_DRY_RUN: ${{ inputs.dry-run }}
        LOCALIZE_OPENAI_API_KEY_INPUT: ${{ inputs.openai-api-key }}
        LOCALIZE_COMMIT_SIGNING_KEY_INPUT: ${{ inputs.commit-signing-key }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys
        from pathlib import Path

        event_name = os.environ.get("GITHUB_EVENT_NAME", "")
        event_path = os.environ.get("GITHUB_EVENT_PATH", "")
        open_pr = os.environ.get("LOCALIZE_OPEN_PR", "").lower() == "true"
        dry_run = os.environ.get("LOCALIZE_DRY_RUN", "").lower() == "true"
        has_sensitive_input = bool(os.environ.get("LOCALIZE_OPENAI_API_KEY_INPUT")) or bool(
            os.environ.get("LOCALIZE_COMMIT_SIGNING_KEY_INPUT")
        )

        event = {}
        if event_path:
            path = Path(event_path)
            if path.exists():
                event = json.loads(path.read_text(encoding="utf-8"))

        def fail(message: str) -> None:
            print(f"::error::{message}")
            sys.exit(1)

        if event_name == "pull_request_target":
            fail(
                "Localize Pipeline must not run from pull_request_target. "
                "Use push/workflow_dispatch for live translation, or pull_request "
                "with dry-run:true and open-pr:false for untrusted PR checks."
            )

        if event_name == "workflow_run":
            workflow_run = event.get("workflow_run") or {}
            if workflow_run.get("event") == "pull_request":
                fail(
                    "Localize Pipeline must not run after a pull_request workflow_run. "
                    "Trigger live translation from trusted push/workflow_dispatch runs instead."
                )

        if event_name == "pull_request":
            pull_request = event.get("pull_request") or {}
            head_repo = (pull_request.get("head") or {}).get("repo") or {}
            repository = event.get("repository") or {}
            if head_repo.get("full_name") != repository.get("full_name"):
                if open_pr or has_sensitive_input or not dry_run:
                    fail(
                        "Fork pull_request runs may only use Localize Pipeline with "
                        "dry-run:true, open-pr:false, and no secret inputs. Run live "
                        "translation after merge or from a trusted manual workflow."
                    )
        PY

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pipeline dependencies
      shell: bash
      run: |
        set -euo pipefail
        LOCALIZE_ACTION_VENV="${RUNNER_TEMP:-/tmp}/localize-pipeline-venv"
        python -m venv "$LOCALIZE_ACTION_VENV"
        "$LOCALIZE_ACTION_VENV/bin/python" -m pip install --upgrade pip
        "$LOCALIZE_ACTION_VENV/bin/python" -m pip install -r "${{ github.action_path }}/requirements.txt"
        echo "$LOCALIZE_ACTION_VENV/bin" >> "$GITHUB_PATH"
        echo "LOCALIZE_ACTION_VENV=$LOCALIZE_ACTION_VENV" >> "$GITHUB_ENV"

    - name: Install plugin dependencies
      if: ${{ inputs.plugin-install-command != '' }}
      shell: bash
      env:
        PLUGIN_INSTALL_COMMAND: ${{ inputs.plugin-install-command }}
      run: |
        set -euo pipefail
        bash -lc "$PLUGIN_INSTALL_COMMAND"

    - name: Validate Action workspace scope
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TRANSLATOR_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config-file }}
        LOCALIZE_ACTION_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python - <<'PY'
        from pathlib import Path
        import os

        import yaml

        workspace = Path(os.environ["LOCALIZE_ACTION_WORKSPACE"]).resolve()
        config_path = Path(os.environ["TRANSLATOR_CONFIG_FILE"]).resolve()
        try:
            config_path.relative_to(workspace)
        except ValueError as exc:
            raise SystemExit(
                f"Configured config file '{config_path}' must be inside "
                f"the GitHub workspace '{workspace}'."
            ) from exc

        raw_config = yaml.safe_load(config_path.read_text(encoding="utf-8")) or {}
        repo_root = Path(str(raw_config.get("target_project_root") or ".")).expanduser()
        if not repo_root.is_absolute():
            repo_root = config_path.parent / repo_root
        repo_root = repo_root.resolve()
        if repo_root != workspace:
            raise SystemExit(
                f"Configured target_project_root '{repo_root}' must resolve exactly "
                f"to the GitHub workspace '{workspace}' for Action execution."
            )

        input_folder = Path(str(raw_config.get("input_folder") or ".")).expanduser()
        if not input_folder.is_absolute():
            input_folder = repo_root / input_folder
        input_folder = input_folder.resolve()
        try:
            input_folder.relative_to(repo_root)
        except ValueError as exc:
            raise SystemExit(
                f"Configured input_folder '{input_folder}' must be inside "
                f"target_project_root '{repo_root}' for Action execution."
            ) from exc
        PY

    - name: Check localization setup
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        TRANSLATOR_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config-file }}
        LOCALIZE_OPENAI_API_KEY_INPUT: ${{ inputs.openai-api-key }}
        LOCALIZE_API_BASE_URL_INPUT: ${{ inputs.api-base-url }}
        LOCALIZE_REVIEW_MODEL_INPUT: ${{ inputs.review-model }}
        LOCALIZE_DRY_RUN: ${{ inputs.dry-run }}
        LOCALIZE_PLUGIN_MODULES: ${{ inputs.plugin-modules }}
      run: |
        set -euo pipefail
        if [ -n "${LOCALIZE_OPENAI_API_KEY_INPUT:-}" ]; then
          export OPENAI_API_KEY="$LOCALIZE_OPENAI_API_KEY_INPUT"
        else
          unset OPENAI_API_KEY
        fi
        if [ -n "${LOCALIZE_API_BASE_URL_INPUT:-}" ]; then
          export OPENAI_BASE_URL="$LOCALIZE_API_BASE_URL_INPUT"
        else
          unset OPENAI_BASE_URL
        fi
        if [ -n "${LOCALIZE_REVIEW_MODEL_INPUT:-}" ]; then
          export REVIEW_MODEL_NAME="$LOCALIZE_REVIEW_MODEL_INPUT"
        else
          unset REVIEW_MODEL_NAME
        fi
        python -m localize.cli check --config "$TRANSLATOR_CONFIG_FILE"

    - name: Translate changed strings
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        TRANSLATOR_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config-file }}
        LOCALIZE_OPENAI_API_KEY_INPUT: ${{ inputs.openai-api-key }}
        LOCALIZE_API_BASE_URL_INPUT: ${{ inputs.api-base-url }}
        LOCALIZE_REVIEW_MODEL_INPUT: ${{ inputs.review-model }}
        PROCESS_ALL_FILES: ${{ inputs.process-all-files }}
        DIFF_BASE_INPUT: ${{ inputs.diff-base }}
        LOCALIZE_DRY_RUN: ${{ inputs.dry-run }}
        LOCALIZE_PLUGIN_MODULES: ${{ inputs.plugin-modules }}
      run: |
        set -euo pipefail
        if [ -n "${LOCALIZE_OPENAI_API_KEY_INPUT:-}" ]; then
          export OPENAI_API_KEY="$LOCALIZE_OPENAI_API_KEY_INPUT"
        else
          unset OPENAI_API_KEY
        fi
        if [ -n "${LOCALIZE_API_BASE_URL_INPUT:-}" ]; then
          export OPENAI_BASE_URL="$LOCALIZE_API_BASE_URL_INPUT"
        else
          unset OPENAI_BASE_URL
        fi
        if [ -n "${LOCALIZE_REVIEW_MODEL_INPUT:-}" ]; then
          export REVIEW_MODEL_NAME="$LOCALIZE_REVIEW_MODEL_INPUT"
        else
          unset REVIEW_MODEL_NAME
        fi
        # An all-zero SHA (first push to a branch) is not a valid diff base; fall back
        # to working-tree detection rather than failing the run.
        if [[ "${DIFF_BASE_INPUT:-}" =~ ^0*$ ]]; then
          export TRANSLATION_DIFF_BASE=""
        else
          export TRANSLATION_DIFF_BASE="$DIFF_BASE_INPUT"
        fi
        if [ -n "${TRANSLATION_DIFF_BASE:-}" ] && ! git cat-file -e "${TRANSLATION_DIFF_BASE}^{commit}" 2>/dev/null; then
          echo "::error::TRANSLATION_DIFF_BASE '$TRANSLATION_DIFF_BASE' is not reachable. Use fetch-depth: 0 or pass a reachable diff-base input."
          exit 1
        fi
        python -m localize.cli run --config "$TRANSLATOR_CONFIG_FILE"

    - name: Run translation quality gate
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        TRANSLATOR_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config-file }}
        ACTION_QUALITY_REPORT_DIR: ${{ github.action_path }}/logs
        LOCALIZE_ACTION_WORKSPACE: ${{ github.workspace }}
        LOCALIZE_OPENAI_API_KEY_INPUT: ${{ inputs.openai-api-key }}
        LOCALIZE_API_BASE_URL_INPUT: ${{ inputs.api-base-url }}
        LOCALIZE_REVIEW_MODEL_INPUT: ${{ inputs.review-model }}
        LOCALIZE_DRY_RUN: ${{ inputs.dry-run }}
        LOCALIZE_PLUGIN_MODULES: ${{ inputs.plugin-modules }}
      run: |
        set -euo pipefail
        gate_paths_file="$(mktemp)"
        changed_files_file="$(mktemp)"
        cleanup_quality_gate() {
          rm -f "$gate_paths_file" "$changed_files_file"
        }
        trap cleanup_quality_gate EXIT
        export LOCALIZE_GATE_PATHS_FILE="$gate_paths_file"
        export LOCALIZE_GATE_CHANGED_FILES="$changed_files_file"

        python - <<'PY'
        import os
        import subprocess
        from pathlib import Path

        import yaml

        config_path = Path(os.environ["TRANSLATOR_CONFIG_FILE"]).resolve()
        raw_config = yaml.safe_load(config_path.read_text(encoding="utf-8")) or {}
        config_dir = config_path.parent
        workspace = Path(os.environ["LOCALIZE_ACTION_WORKSPACE"]).resolve()

        repo_root = Path(str(raw_config.get("target_project_root") or ".")).expanduser()
        if not repo_root.is_absolute():
            repo_root = config_dir / repo_root
        repo_root = repo_root.resolve()
        if repo_root != workspace:
            raise SystemExit(
                f"Configured target_project_root '{repo_root}' must resolve exactly "
                f"to the GitHub workspace '{workspace}' for Action publication."
            )

        input_folder = Path(str(raw_config.get("input_folder") or ".")).expanduser()
        if not input_folder.is_absolute():
            input_folder = repo_root / input_folder
        input_folder = input_folder.resolve()
        try:
            input_relative = input_folder.relative_to(repo_root)
        except ValueError as exc:
            raise SystemExit(
                f"Configured input_folder '{input_folder}' must be inside "
                f"target_project_root '{repo_root}' for Action publication."
            ) from exc

        relative_text = input_relative.as_posix() or "."
        subprocess.run(["git", "reset", "-q"], cwd=repo_root, check=True)
        subprocess.run(
            [
                "git",
                "add",
                "-A",
                "--",
                relative_text,
                f":(exclude,glob){relative_text}/archive/**",
                f":(exclude,glob){relative_text}/**/archive/**",
            ],
            cwd=repo_root,
            check=True,
        )
        changed = subprocess.run(
            [
                "git",
                "diff",
                "--cached",
                "--name-only",
                "--diff-filter=ACMRT",
                "--",
                relative_text,
            ],
            cwd=repo_root,
            check=True,
            text=True,
            stdout=subprocess.PIPE,
        ).stdout.splitlines()

        Path(os.environ["LOCALIZE_GATE_PATHS_FILE"]).write_text(
            f"{repo_root}\n{input_folder}\n",
            encoding="utf-8",
        )
        Path(os.environ["LOCALIZE_GATE_CHANGED_FILES"]).write_text(
            "".join(f"{path}\n" for path in changed),
            encoding="utf-8",
        )
        PY

        IFS= read -r repo_root < "$gate_paths_file"
        input_folder="$(sed -n '2p' "$gate_paths_file")"
        changed_files=()
        while IFS= read -r changed_file; do
          if [ -n "$changed_file" ]; then
            changed_files+=("$changed_file")
          fi
        done < "$changed_files_file"

        if [ "${#changed_files[@]}" -eq 0 ]; then
          echo "No changed localization files; quality gate has nothing to check."
          exit 0
        fi

        mkdir -p "$ACTION_QUALITY_REPORT_DIR"
        if [ -n "${LOCALIZE_OPENAI_API_KEY_INPUT:-}" ]; then
          export OPENAI_API_KEY="$LOCALIZE_OPENAI_API_KEY_INPUT"
        else
          unset OPENAI_API_KEY
        fi
        if [ -n "${LOCALIZE_API_BASE_URL_INPUT:-}" ]; then
          export OPENAI_BASE_URL="$LOCALIZE_API_BASE_URL_INPUT"
        else
          unset OPENAI_BASE_URL
        fi
        if [ -n "${LOCALIZE_REVIEW_MODEL_INPUT:-}" ]; then
          export REVIEW_MODEL_NAME="$LOCALIZE_REVIEW_MODEL_INPUT"
        else
          unset REVIEW_MODEL_NAME
        fi
        python -m localize.translation_semantic_reviewer \
          --repo-root "$repo_root" \
          --input-folder "$input_folder" \
          --config "$TRANSLATOR_CONFIG_FILE" \
          --validation-summary "$ACTION_QUALITY_REPORT_DIR/translation_validation_summary.json" \
          --token-usage-summary "$ACTION_QUALITY_REPORT_DIR/token_usage_summary.json" \
          --changed-files "${changed_files[@]}"
        git add -- "${changed_files[@]}"
        unset OPENAI_API_KEY LOCALIZE_OPENAI_API_KEY_INPUT

        python -m localize.cli quality-gate \
          --repo-root "$repo_root" \
          --input-folder "$input_folder" \
          --config "$TRANSLATOR_CONFIG_FILE" \
          --validation-summary "$ACTION_QUALITY_REPORT_DIR/translation_validation_summary.json" \
          --output-json "$ACTION_QUALITY_REPORT_DIR/translation_quality_report.json" \
          --output-markdown "$ACTION_QUALITY_REPORT_DIR/translation_quality_report.md" \
          --changed-files "${changed_files[@]}"

    - name: Open pull request
      if: ${{ inputs.open-pr == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # Pass user-controlled inputs through the environment, never interpolated
        # directly into the script, to avoid shell/command injection.
        GH_TOKEN: ${{ inputs.github-token }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        COMMIT_MSG: ${{ inputs.commit-message }}
        PR_TITLE: ${{ inputs.pr-title }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        COMMIT_SIGNING_METHOD: ${{ inputs.commit-signing-method }}
        COMMIT_SIGNING_KEY: ${{ inputs.commit-signing-key }}
        TRANSLATOR_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config-file }}
        ACTION_LOG_DIR: ${{ github.action_path }}/logs
      run: |
        set -euo pipefail
        if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
          echo "No translation changes; nothing to open a PR for."
          exit 0
        fi

        signing_key_file=""
        git_askpass_file=""
        cleanup_pr_step() {
          if [ -n "${signing_key_file:-}" ]; then
            rm -f "$signing_key_file"
          fi
          if [ -n "${git_askpass_file:-}" ]; then
            rm -f "$git_askpass_file"
          fi
        }
        trap cleanup_pr_step EXIT

        commit_args=(-m "$COMMIT_MSG")
        case "${COMMIT_SIGNING_METHOD:-none}" in
          ""|"none")
            git config commit.gpgsign false
            ;;
          "ssh")
            if [ -z "${COMMIT_SIGNING_KEY:-}" ]; then
              echo "::error::commit-signing-method is 'ssh' but commit-signing-key is empty."
              exit 1
            fi
            signing_key_file="${RUNNER_TEMP:-/tmp}/localize-commit-signing-key"
            umask 077
            printf '%s\n' "$COMMIT_SIGNING_KEY" > "$signing_key_file"
            chmod 600 "$signing_key_file"
            ssh-keygen -y -f "$signing_key_file" >/dev/null
            git config gpg.format ssh
            git config user.signingkey "$signing_key_file"
            git config commit.gpgsign true
            commit_args=(-S -m "$COMMIT_MSG")
            ;;
          *)
            echo "::error::Unsupported commit-signing-method '${COMMIT_SIGNING_METHOD}'. Use 'none' or 'ssh'."
            exit 1
            ;;
        esac

        branch="$PR_BRANCH"
        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"
        git checkout -B "$branch"

        stage_roots_file="${RUNNER_TEMP:-/tmp}/localize-stage-roots.txt"
        python - <<'PY' > "$stage_roots_file"
        import os
        import sys
        from pathlib import Path

        import yaml

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        config_file = Path(os.environ["TRANSLATOR_CONFIG_FILE"]).resolve()
        config = yaml.safe_load(config_file.read_text(encoding="utf-8")) or {}

        target_root = Path(str(config.get("target_project_root") or "."))
        if not target_root.is_absolute():
            target_root = config_file.parent / target_root
        target_root = target_root.resolve()

        input_folder = Path(str(config.get("input_folder") or "."))
        if not input_folder.is_absolute():
            input_folder = target_root / input_folder
        input_folder = input_folder.resolve()

        try:
            relative = input_folder.relative_to(workspace)
        except ValueError:
            print(
                f"Configured input_folder '{input_folder}' is outside the GitHub workspace '{workspace}'.",
                file=sys.stderr,
            )
            sys.exit(1)

        relative_text = relative.as_posix() or "."
        print(relative_text)
        PY

        git reset -q
        while IFS= read -r stage_root; do
          if [ -z "$stage_root" ]; then
            continue
          fi
          if [ "$stage_root" = "." ]; then
            git add -A -- . ":(exclude,glob)**/archive/**"
          else
            git add -A -- "$stage_root" \
              ":(exclude)$stage_root/archive/**" \
              ":(exclude,glob)$stage_root/**/archive/**"
          fi
        done < "$stage_roots_file"

        if git diff --cached --quiet; then
          echo "No stageable localization changes after excluding archive folders; nothing to open a PR for."
          exit 0
        fi

        if ! gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push // false' | grep -qx true; then
          echo "::error::github-token must have contents:write permission to push '$branch'."
          exit 1
        fi

        git_askpass_file="${RUNNER_TEMP:-/tmp}/localize-git-askpass"
        cat > "$git_askpass_file" <<'EOF'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' x-access-token ;;
          *Password*) printf '%s\n' "${GH_TOKEN:?}" ;;
          *) printf '\n' ;;
        esac
        EOF
        chmod 700 "$git_askpass_file"
        export GIT_ASKPASS="$git_askpass_file"
        export GIT_TERMINAL_PROMPT=0
        git remote set-url --push origin "https://github.com/${GITHUB_REPOSITORY}.git"

        body_file="${RUNNER_TEMP:-/tmp}/localize-pr-body.md"
        LOCALIZE_PR_BODY_FILE="$body_file" python - <<'PY'
        import json
        import os
        from pathlib import Path

        log_dir = Path(os.environ["ACTION_LOG_DIR"])
        body_file = Path(os.environ["LOCALIZE_PR_BODY_FILE"])

        def load_json(name):
            path = log_dir / name
            if not path.exists():
                return None
            with path.open("r", encoding="utf-8") as file:
                return json.load(file)

        translation = load_json("translation_summary.json") or {}
        validation = load_json("translation_validation_summary.json") or {}
        usage = load_json("token_usage_summary.json") or {}

        files_count = translation.get("files_count")
        if files_count is None:
            files_count = len(translation.get("processed_files", []))
        locales = translation.get("locales") or []
        modules = translation.get("modules") or []
        new_keys = int(translation.get("new_keys_count") or 0)
        updated_keys = int(translation.get("updated_keys_count") or 0)

        validation_files = validation.get("files") or {}
        pipeline_warnings = validation.get("pipeline_warnings") or []
        if isinstance(validation.get("skipped_files"), dict):
            pipeline_warnings.extend(
                {"file": name, "errors": errors}
                for name, errors in validation["skipped_files"].items()
            )
        reverted_keys = sum(
            int(summary.get("reverted_keys_count") or 0)
            for summary in validation_files.values()
            if isinstance(summary, dict)
        )
        placeholder_failures = sum(
            int(summary.get("placeholder_failures_count") or 0)
            for summary in validation_files.values()
            if isinstance(summary, dict)
        )
        control_findings = sum(
            int(summary.get("control_character_findings_count") or 0)
            for summary in validation_files.values()
            if isinstance(summary, dict)
        )

        totals = usage.get("totals") or {}
        calls = totals.get("calls")
        total_tokens = totals.get("total_tokens")
        estimated_cost = totals.get("estimated_cost_usd")

        lines = [
            "Automated translation update from Localize Pipeline.",
            "",
            "## Run Summary",
            f"- Files translated: {files_count}",
            f"- Locales: {', '.join(f'`{locale}`' for locale in locales) if locales else 'n/a'}",
            f"- Modules: {', '.join(f'`{module}`' for module in modules) if modules else 'n/a'}",
            f"- New keys: {new_keys}",
            f"- Updated keys: {updated_keys}",
            "",
            "## Validation",
            f"- Files with validation summaries: {len(validation_files)}",
            f"- Reverted keys: {reverted_keys}",
            f"- Placeholder failures: {placeholder_failures}",
            f"- Control-character findings: {control_findings}",
            f"- Pipeline warnings: {len(pipeline_warnings)}",
            "",
            "## Token Usage",
            f"- API calls: {calls if calls is not None else 'n/a'}",
            f"- Total tokens: {total_tokens if total_tokens is not None else 'n/a'}",
            f"- Estimated cost: ${estimated_cost:.4f}" if isinstance(estimated_cost, (int, float)) else "- Estimated cost: n/a",
            "",
            "Review the changed localization files before merging.",
            "Detailed JSON summaries are attached to the workflow run when available.",
        ]

        if pipeline_warnings:
            lines.extend(["", "## Warnings"])
            for warning in pipeline_warnings[:10]:
                if isinstance(warning, dict):
                    filename = warning.get("file", "unknown")
                    errors = warning.get("errors", [])
                    lines.append(f"- `{filename}`: {len(errors)} issue(s)")
                else:
                    lines.append(f"- {warning}")
            if len(pipeline_warnings) > 10:
                lines.append(f"- ...and {len(pipeline_warnings) - 10} more warning(s)")

        body_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY

        git commit "${commit_args[@]}"
        remote_ref="refs/heads/$branch"
        expected_remote_sha="$(git ls-remote --heads origin "$branch" | awk '{print $1}')"
        git fetch origin "+$remote_ref:refs/remotes/origin/$branch" || true
        if [ -n "$expected_remote_sha" ]; then
          git push --force-with-lease="$remote_ref:$expected_remote_sha" origin "$branch"
        else
          git push origin "$branch"
        fi
        if gh pr view "$branch" >/dev/null 2>&1; then
          echo "Pull request already exists for $branch; it now points at the latest push."
          gh pr edit "$branch" --title "$PR_TITLE" --body-file "$body_file"
        else
          gh pr create --head "$branch" --title "$PR_TITLE" --body-file "$body_file"
        fi

    - name: Upload run summaries
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: localize-pipeline-summaries
        path: |
          ${{ github.action_path }}/logs/translation_summary.json
          ${{ github.action_path }}/logs/translation_validation_summary.json
          ${{ github.action_path }}/logs/translation_quality_report.json
          ${{ github.action_path }}/logs/translation_quality_report.md
          ${{ github.action_path }}/logs/token_usage_summary.json
          ${{ github.action_path }}/logs/skipped_files_report.log
        if-no-files-found: ignore
