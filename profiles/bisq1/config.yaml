# The manual runner resolves paths into its own workspace.
target_project_root: /target_repo
run_safeguards:
  state_path: "logs/run_safeguards.sqlite3"
  max_requests_per_24h: 1000
  sample_files: 3
  sample_keys: 5
  sample_max_requests: 60
input_folder: core/src/main/resources/i18n
glossary_file_path: glossary.json
translation_glossary_enforcement: prompt-only
translation_source: git
localization_format: java_properties
localization_layout:
  id: suffix
  source_locale: en
translation_file_filter_glob: displayStrings_*.properties
process_all_files: true
dry_run: false
retranslate_identical_source_strings: false
accepted_source_identical_translations:
  cs:
    payment.account.revtag: Revtag
    CLEAR_X_CHANGE: Zelle
  de:
    payment.account.revtag: Revtag
    CLEAR_X_CHANGE: Zelle
