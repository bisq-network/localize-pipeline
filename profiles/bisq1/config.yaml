    CLEAR_X_CHANGE: Zelle
  zh-hans:
    payment.account.revtag: Revtag
    CLEAR_X_CHANGE: Zelle
  zh-hant:
    payment.account.revtag: Revtag
    CLEAR_X_CHANGE: Zelle
project_context: >
  Translate for Bisq 1, the original desktop peer-to-peer bitcoin exchange.
  Preserve the meaning of security warnings, multisignature escrow, security
  deposits, mediation, arbitration, and DAO governance. This application uses
  the Bisq 1 trading protocol; do not add Bisq Easy or MuSig concepts absent
  from the source. Preserve explicit source references to other Bisq products.
  Preserve placeholders, URLs, line breaks, currency codes, and brand names.
  Keep existing terminology and forms of address consistent within each locale.
model_provider: aisuite
model_name: gpt-6-sol
model_reasoning_effort: none
model_max_completion_tokens: 4096
review_model_name: gpt-6.1-sol
review_reasoning_effort: low
max_concurrent_api_calls: 1
semantic_review:
  enabled: true
  model: gpt-6-luna
  reasoning_effort: none
  auto_apply_error_suggestions: false
quality_gate:
  source_identical_min_block_count: 5
  source_identical_max_count: 20
  source_identical_max_ratio: 0.30
  block_on_pipeline_warnings: true
  block_on_semantic_qa_findings: true
  block_on_semantic_qa_warnings: false
  semantic_qa_audit_scope: changed
