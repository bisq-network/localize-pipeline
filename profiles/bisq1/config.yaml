style_rules:
  de:
    - Use Schiedsrichter for arbitrators and Mediator for mediators in new prose.
    - Preserve existing quoted UI labels exactly, including legacy Vermittler labels.
  pt-br:
    - Use Brazilian Portuguese spelling and vocabulary.
  pt:
    - Use European Portuguese spelling and vocabulary.
  zh-hans:
    - Use Simplified Chinese characters.
  zh-hant:
    - Use Traditional Chinese characters.
