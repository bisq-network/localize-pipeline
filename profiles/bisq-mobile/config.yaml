target_project_root: "/target_repo"
run_safeguards:
  state_path: "/app/logs/run_safeguards.sqlite3"
  max_requests_per_24h: 750
  sample_files: 3
  sample_keys: 5
  sample_max_requests: 60
input_folder: "/target_repo/shared/domain/src/commonMain/resources/mobile"
glossary_file_path: "glossary.json"
localization_format: "java_properties"
translation_source: "transifex"
project_context: >
  Translate for Bisq mobile, the Kotlin Multiplatform mobile companion for the
  Bisq peer-to-peer bitcoin trading ecosystem. Keep navigation labels concise,
  preserve product names, and prefer mobile UI wording over long desktop-style
  phrases.
model_name: "gpt-4o-mini"
review_model_name: "gpt-5.6-terra"
review_reasoning_effort: "none"
translation_queue_folder: "translation_queue"
translated_queue_folder: "translated_queue"
dry_run: false
retranslate_identical_source_strings: false
# Reviewed corrections in bisq-mobile#1919; later source changes revoke acceptance.
accepted_source_identical_translations:
  pcm:
    mobile.client.topic.private_chat_channels.title: "Private chats"
    mobile.community.contacts.reason.privateChat: "Private chat"
translation_key_ledger_file_path: "/app/logs/translation_key_ledger.json"
quality_gate:
  source_identical_min_block_count: 5
  source_identical_max_count: 20
  source_identical_max_ratio: 0.30
  block_on_pipeline_warnings: true
  block_on_semantic_qa_findings: true
  block_on_semantic_qa_warnings: false
  semantic_qa_audit_scope: "changed"
  retained_source_word_allowlist:
    es: ["personal"]
    fr: ["information", "message", "messages"]
    it: ["reporting"]
semantic_review:
  enabled: true
  model: "gpt-5.4-mini"
  reasoning_effort: "none"
  auto_apply_error_suggestions: true
semantic_quality_rules:
  # Opt-in exact-copy recurrence guards; this is not a general semantic validator.
  # Pinned originals/corrections: tests/fixtures/project_policy/bisq_review_regressions.json.
  # An English source change revokes each guard and requires a new review.
  - id: "mobile-pcm-private-chats-known-typo"
    message: 'Use ''Private'' instead of the known ''Privet'' typo in this label.'
    locales: ['pcm']
    keys: ['mobile.client.topic.private_chat_channels.title']
    source_regex: '\APrivate chats\Z'
    forbidden_target_regex: '\APrivet chats\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq-mobile/blob/28612a5ea4e8033a738fd20dda4012718c4be78b/shared/domain/src/commonMain/resources/mobile/mobile_pcm.properties'
  - id: "mobile-pcm-private-chat-known-typo"
    message: 'Use ''Private'' instead of the known ''Privet'' typo in this label.'
    locales: ['pcm']
    keys: ['mobile.community.contacts.reason.privateChat']
    source_regex: '\APrivate chat\Z'
    forbidden_target_regex: '\APrivet chat\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq-mobile/blob/28612a5ea4e8033a738fd20dda4012718c4be78b/shared/domain/src/commonMain/resources/mobile/mobile_pcm.properties'
  - id: "mobile-log-known-stale-es"
    message: 'Update this log-file warning to reflect the current sharing and redaction behavior.'
    locales: ['es']
    keys: ['mobile.genericError.reportInfo.logFile']
    source_regex: '\AIt will make debugging easier if you attach the log file to your bug report\. Only the most recent part is shared, and network addresses, profile and trade identifiers are replaced with placeholders before it leaves the device\.\Z'
    forbidden_target_regex: '\AFacilitará la depuración si adjuntas el archivo de registro a tu informe de error\. Por favor, revísalo primero, puede contener direcciones de red y detalles de comercio\.\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq-mobile/blob/a822b2d67dce327c00d7dccc358518f6c736aa11/shared/domain/src/commonMain/resources/mobile/mobile_es.properties'
  - id: "mobile-log-known-stale-fr"
    message: 'Update this log-file warning to reflect the current sharing and redaction behavior.'
    locales: ['fr']
    keys: ['mobile.genericError.reportInfo.logFile']
    source_regex: '\AIt will make debugging easier if you attach the log file to your bug report\. Only the most recent part is shared, and network addresses, profile and trade identifiers are replaced with placeholders before it leaves the device\.\Z'
    forbidden_target_regex: '\AIl sera plus facile de déboguer si vous joignez le fichier journal à votre rapport de bogue\. Veuillez le consulter d''abord, il peut contenir des adresses réseau et des détails sur les échanges\.\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq-mobile/blob/a822b2d67dce327c00d7dccc358518f6c736aa11/shared/domain/src/commonMain/resources/mobile/mobile_fr.properties'
  - id: "mobile-log-known-stale-hi"
    message: 'Update this log-file warning to reflect the current sharing and redaction behavior.'
    locales: ['hi']
    keys: ['mobile.genericError.reportInfo.logFile']
    source_regex: '\AIt will make debugging easier if you attach the log file to your bug report\. Only the most recent part is shared, and network addresses, profile and trade identifiers are replaced with placeholders before it leaves the device\.\Z'
    forbidden_target_regex: '\Aयदि आप अपनी बग रिपोर्ट के साथ लॉग फ़ाइल संलग्न करते हैं तो यह डिबगिंग को आसान बना देगा। कृपया पहले इसकी समीक्षा करें, इसमें नेटवर्क पते और व्यापार विवरण हो सकते हैं।\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq-mobile/blob/a822b2d67dce327c00d7dccc358518f6c736aa11/shared/domain/src/commonMain/resources/mobile/mobile_hi.properties'
  - id: "mobile-log-known-stale-pt-br"
    message: 'Update this log-file warning to reflect the current sharing and redaction behavior.'
    locales: ['pt_BR']
    keys: ['mobile.genericError.reportInfo.logFile']
    source_regex: '\AIt will make debugging easier if you attach the log file to your bug report\. Only the most recent part is shared, and network addresses, profile and trade identifiers are replaced with placeholders before it leaves the device\.\Z'
    forbidden_target_regex: '\ASerá mais fácil depurar se você anexar o arquivo de log ao seu relatório de bug\. Por favor, revise\-o primeiro, ele pode conter endereços de rede e detalhes da negociação\.\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq-mobile/blob/a822b2d67dce327c00d7dccc358518f6c736aa11/shared/domain/src/commonMain/resources/mobile/mobile_pt_BR.properties'
  - id: "it-trade-failure-terminology"
    message: "Use 'scambio', without 'transazione' or 'commercio', for 'trade' in these reviewed Italian failure messages."
    locales: ["it"]
    keys:
      - "bisqEasy.openTrades.failed"
      - "bisqEasy.openTrades.failed.popup"
      - "bisqEasy.openTrades.failedAtPeer"
      - "bisqEasy.openTrades.failedAtPeer.popup"
    source_regex: '\btrade\b'
    required_target_regex: '\bscambio\b'
    forbidden_target_regex: '\b(?:transazione|commercio)\b'
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1913"
  - id: "trade-history-traders-label"
    message: "Fully localize the Trade Details traders/role label; do not retain the English term 'Traders'."
    locales: ["*"]
    excluded_locales: ["en", "pcm"]
    keys: ["mobile.tradeHistory.details.tradersAndRole"]
    forbidden_target_regex: "\\bTraders\\b"
    severity: "error"
    source: "bisq-mobile#1478 CodeRabbit"
  - id: "af-trade-history-counts-trades"
    message: "Afrikaans trade-count labels must count trades, not traders."
    locales: ["af_ZA"]
    keys: ["mobile.tradeHistory.count.many", "mobile.tradeHistory.count.filtered"]
    forbidden_target_regex: "\\bhandelaars\\b"
    severity: "error"
    source: "bisq-mobile#1478 CodeRabbit"
  - id: "vi-clearnet-clear-network-address"
    message: "Vietnamese networkAddress.clear must describe a clearnet/open network address, not a delete action."
    locales: ["vi"]
    keys: ["mobile.tradeHistory.details.networkAddress.clear"]
    forbidden_target_regex: "^xóa\\b"
    severity: "error"
    source: "bisq-mobile#1478 CodeRabbit"
  - id: "analytics-cta-truncated-reporting"
    message: "Analytics CTA labels must not contain truncated English words such as 'reportin'."
    locales: ["*"]
    keys: ["*"]
    forbidden_target_regex: "\\breportin\\b"
    severity: "error"
    source: "bisq-mobile#1490 CodeRabbit"
  - id: "analytics-cta-reporting-loanword"
    message: "French and Italian analytics CTA labels must fully localize 'reporting'."
    locales: ["fr", "it"]
    keys: ["mobile.welcomeCarousel.analytics.action"]
    forbidden_target_regex: "\\breporting\\b"
    severity: "error"
    source: "bisq-mobile#1490 CodeRabbit"
  - id: "it-analytics-self-hosted"
    message: "Italian analytics copy must localize 'self-hosted' instead of retaining the English term."
    locales: ["it"]
    keys: ["*"]
    forbidden_target_regex: "\\bself-hosted\\b"
    severity: "error"
    source: "bisq-mobile#1484 CodeRabbit"
  - id: "fr-analytics-no-pii-negation"
    message: "French no-PII analytics copy must keep parallel negation for accounts and device identifiers."
    locales: ["fr"]
    keys: ["mobile.settings.analytics.info.noPii"]
    forbidden_target_regex: "^Aucune information personnelle,\\s*comptes\\b"
    severity: "error"
    source: "bisq-mobile#1484 CodeRabbit"
  - id: "network-seed-node-not-seed-phrase"
    message: "On the Network connections screen 'Seed' labels a seed node (bootstrap peer), not a wallet recovery phrase; do not translate it as seed phrase/words."
    locales: ["cs", "es", "ru", "id", "it", "vi", "fr"]
    keys: ["mobile.networkInfo.connections.seed"]
    forbidden_target_regex: "(Slova|Frase|фраза|Kata|Parole|khóa|Récupération)"
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1606, #1669 CodeRabbit"
  - id: "network-transport-not-physical-transport"
    message: "On the Network screens 'Transport' is the network transport (e.g. Tor/clearnet), not physical transportation/shipping."
    locales: ["af_ZA", "cs", "vi"]
    keys: ["mobile.networkInfo.myNode.transport", "mobile.networkInfo.overview.transport"]
    forbidden_target_regex: "(Vervoer|Doprava|Vận chuyển)"
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1606 CodeRabbit"
  - id: "no-vietnamese-horn-vowels-outside-vi"
    message: "Vietnamese horn vowels (ư/ơ and their tone-mark variants) must not appear outside the Vietnamese locale; they signal cross-language contamination such as the Yoruba 'dữdata' token that fused Vietnamese 'dữ' with English 'data'."
    locales: ["*"]
    excluded_locales: ["vi"]
    keys: ["*"]
    forbidden_target_regex: '[ưừứữửựƯỪỨỮỬỰơờớỡởợƠỜỚỠỞỢ]'
    severity: "error"
    source: "bisq2#4884 CodeRabbit"
supported_locales:
  - code: "af_ZA"
    name: "Afrikaans"
  - code: "cs"
    name: "Czech"
  - code: "da"
    name: "Danish"
  - code: "de"
    name: "German"
  - code: "es"
    name: "Spanish"
  - code: "fr"
    name: "French"
  - code: "id"
    name: "Indonesian"
  - code: "it"
    name: "Italian"
  - code: "pt_BR"
    name: "Brazilian Portuguese"
  - code: "pt_PT"
    name: "Portuguese"
  - code: "ru"
    name: "Russian"
  - code: "sv"
    name: "Swedish"
  - code: "th"
    name: "Thai"
  - code: "vi"
    name: "Vietnamese"
style_rules:
  de:
    - "Use natural mobile labels; prefer 'Häufige Fragen' over source-identical 'FAQs' when a short native label fits."
  es:
    - "Keep navigation labels short and fully localized unless the term is a brand name."
  fr:
    - "Do not retain English analytics terms such as reporting when a natural French equivalent is available."
brand_technical_glossary:
  - "Bisq"
  - "Bisq Easy"
  - "Bitcoin"
  - "BTC"
  - "Lightning"
  - "MuSig"
  - "Tor"
