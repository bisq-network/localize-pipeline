target_project_root: '/target_repo'
run_safeguards:
  state_path: "/app/logs/run_safeguards.sqlite3"
  max_requests_per_24h: 2000
  sample_files: 3
  sample_keys: 5
  sample_max_requests: 60
# Mounted Git repository root
input_folder: '/target_repo/i18n/src/main/resources' # Path relative to target_project_root
glossary_file_path: 'glossary.json' # Mounted directly to /app/glossary.json
localization_format: "java_properties"
project_context: >
  Translate for Bisq, an open-source peer-to-peer bitcoin trading application.
  Keep UI labels concise and consistent with common software terminology. Bisq
  lets users buy and sell bitcoin privately using its peer-to-peer network.
  "Bisq Easy" is a brand name and must not be translated.
model_name: 'gpt-4o-mini'
translation_queue_folder: 'translation_queue' # Relative to /app
translated_queue_folder: 'translated_queue' # Relative to /app
dry_run: false
retranslate_identical_source_strings: false
translation_key_ledger_file_path: "/app/logs/translation_key_ledger.json"
quality_gate:
  source_identical_min_block_count: 5
  source_identical_max_count: 20
  source_identical_max_ratio: 0.30
  block_on_pipeline_warnings: true
  block_on_semantic_qa_findings: true
  block_on_semantic_qa_warnings: false
  semantic_qa_audit_scope: "changed"
  retained_source_word_allowlist:
    da: ["version"]
    de: ["version"]
    es: ["personal"]
    fr: ["information", "message", "messages", "version"]
    it: ["reporting"]
    nl: ["contact"]
    sv: ["version"]
semantic_review:
  enabled: true
  model: "gpt-5.4-mini"
  reasoning_effort: "none"
  auto_apply_error_suggestions: true
semantic_quality_rules:
  # Opt-in exact-copy recurrence guards; this is not a general semantic validator.
  # Pinned originals/corrections: tests/fixtures/project_policy/bisq_review_regressions.json.
  # An English source change revokes each guard and requires a new review.
  - id: "bisq-note-known-saved-lt"
    message: 'State that the address note has not been saved before warning about its loss.'
    locales: ['lt']
    keys: ['wallet.receive.overlay.description']
    source_regex: '\AYou haven''t saved the address note\. If you proceed without saving, the note will be lost\. Do you want to continue\?\Z'
    forbidden_target_regex: '\AJūs nesaugote adreso pastabos\. Jei tęsite be išsaugojimo, pastaba bus prarasta\. Ar norite tęsti\?\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq2/pull/4963#discussion_r3840574813'
  - id: "bisq-note-known-saved-sk"
    message: 'State that the address note has not been saved before warning about its loss.'
    locales: ['sk']
    keys: ['wallet.receive.overlay.description']
    source_regex: '\AYou haven''t saved the address note\. If you proceed without saving, the note will be lost\. Do you want to continue\?\Z'
    forbidden_target_regex: '\ANespravili ste poznámku k adrese\. Ak pokračujete bez uloženia, poznámka sa stratí\. Chcete pokračovať\?\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq2/pull/4963#discussion_r3840574829'
  - id: "bisq-bond-known-unlock-sv"
    message: 'Tell users to lock the required BSQ bond, rather than unlock it.'
    locales: ['sv']
    keys: ['user.bondedRoles.registration.how.info']
    source_regex: '\A1\. Select the user profile you want to use for registration and create a backup of your data directory\.\\n2\. Make a proposal at ''''https://github\.com/bisq\-network/proposals'''' to become \{0\} and add your profile ID to the proposal\.\\n3\. After your proposal got reviewed and got support from the community, make a DAO proposal for a bonded role\.\\n4\. After your DAO proposal got accepted in DAO voting lock up the required BSQ bond\.\\n5\. After your bond transaction is confirmed go to ''''DAO/Bonding/Bonded roles'''' in Bisq 1 and click on the sign button to open the signing popup window\.\\n6\. Copy the profile ID and paste it into the message field\. Click sign and copy the signature\. Paste the signature to the Bisq 2 signature field\.\\n7\. Copy the proposal transaction ID from the accepted proposal details in Bisq 1 and paste it into the Bisq 2 proposal transaction ID field\.\\n8\. Copy the lockup transaction ID from ''''DAO/Bonding/Bonded roles'''' in Bisq 1 and paste it into the Bisq 2 lockup transaction ID field\.\\n9\. Enter the bondholder username\.\\n\{1\}\Z'
    forbidden_target_regex: '\A1\. Välj användarprofilen som du vill använda för registrering och skapa en säkerhetskopia av din datakatalog\.\\n2\. Gör ett förslag på ''''https://github\.com/bisq\-network/proposals'''' för att bli \{0\} och lägg till ditt profil\-ID i förslaget\.\\n3\. Efter att ditt förslag har granskats och fått stöd från gemenskapen, gör ett DAO\-förslag för en bundet roll\.\\n4\. Efter att ditt DAO\-förslag har accepterats i DAO\-omröstningen, lås upp den erforderliga BSQ\-obligationen\.\\n5\. Efter att din obligationstransaktion har bekräftats, gå till ''''DAO/Bonding/Bonded roles'''' i Bisq 1 och klicka på signera\-knappen för att öppna fönstret för signering\.\\n6\. Kopiera profil\-ID:t och klistra in det i meddelandefältet\. Klicka på signera och kopiera signaturen\. Klistra in signaturen i Bisq 2:s signaturfält\.\\n7\. Kopiera transaktions\-ID:t för förslaget från detaljerna för det accepterade förslaget i Bisq 1 och klistra in det i Bisq 2:s fält för transaktions\-ID för förslaget\.\\n8\. Kopiera låsningstransaktions\-ID:t från ''''DAO/Bonding/Bonded roles'''' i Bisq 1 och klistra in det i Bisq 2:s fält för låsningstransaktions\-ID\.\\n9\. Ange obligationsinnehavarens användarnamn\.\\n\{1\}\Z'
    severity: "error"
    source: 'https://github.com/bisq-network/bisq2/pull/4963#discussion_r3840574786'
  - id: "it-trade-failure-terminology"
    message: "Use 'scambio', without 'transazione' or 'commercio', for 'trade' in these reviewed Italian failure messages."
    locales: ["it"]
    keys:
      - "bisqEasy.openTrades.failed"
      - "bisqEasy.openTrades.failed.popup"
      - "bisqEasy.openTrades.failedAtPeer"
      - "bisqEasy.openTrades.failedAtPeer.popup"
    source_regex: '\btrade\b'
    required_target_regex: '\bscambio\b'
    forbidden_target_regex: '\b(?:transazione|commercio)\b'
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1913"
  - id: "trade-history-traders-label"
    message: "Fully localize the Trade Details traders/role label; do not retain the English term 'Traders'."
    locales: ["*"]
    excluded_locales: ["en", "pcm"]
    keys: ["mobile.tradeHistory.details.tradersAndRole"]
    forbidden_target_regex: '\bTraders\b'
    severity: "error"
    source: "bisq-mobile#1478 CodeRabbit"
  - id: "af-trade-history-counts-trades"
    message: "Afrikaans trade-count labels must count trades, not traders."
    locales: ["af_ZA"]
    keys: ["mobile.tradeHistory.count.many", "mobile.tradeHistory.count.filtered"]
    forbidden_target_regex: '\bhandelaars\b'
    severity: "error"
    source: "bisq-mobile#1478 CodeRabbit"
  - id: "vi-clearnet-clear-network-address"
    message: "Vietnamese networkAddress.clear must describe a clearnet/open network address, not a delete action."
    locales: ["vi"]
    keys: ["mobile.tradeHistory.details.networkAddress.clear"]
    forbidden_target_regex: '^xóa\b'
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1478 CodeRabbit"
  - id: "analytics-cta-truncated-reporting"
    message: "Analytics CTA labels must not contain truncated English words such as 'reportin'."
    locales: ["*"]
    keys: ["*"]
    forbidden_target_regex: '\breportin\b'
    severity: "error"
    source: "bisq-mobile#1490 CodeRabbit"
  - id: "analytics-cta-reporting-loanword"
    message: "French and Italian analytics CTA labels must fully localize 'reporting'."
    locales: ["fr", "it"]
    keys: ["mobile.welcomeCarousel.analytics.action"]
    forbidden_target_regex: '\breporting\b'
    severity: "error"
    source: "bisq-mobile#1490 CodeRabbit"
  - id: "it-analytics-self-hosted"
    message: "Italian analytics copy must localize 'self-hosted' instead of retaining the English term."
    locales: ["it"]
    keys: ["*"]
    forbidden_target_regex: '\bself-hosted\b'
    severity: "error"
    source: "bisq-mobile#1484 CodeRabbit"
  - id: "fr-analytics-no-pii-negation"
    message: "French no-PII analytics copy must keep parallel negation for accounts and device identifiers."
    locales: ["fr"]
    keys: ["mobile.settings.analytics.info.noPii"]
    forbidden_target_regex: '^Aucune information personnelle,\s*comptes\b'
    severity: "error"
    source: "bisq-mobile#1484 CodeRabbit"
  - id: "el-tac-duplicate-compensation"
    message: "Greek TAC recovery disclaimers must not repeat the compensation term in the recovery/refund/compensation trio."
    locales: ["el"]
    keys: ["tac.risk.noGuarantees.body", "tac.risk.accept.noRecovery"]
    forbidden_target_regex: 'αποζημίωση\s+ή\s+η\s+αποζημίωση'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "fi-tac-fused-all-information"
    message: "Finnish TAC information copy must use 'kaikkien tietojen' instead of the fused form."
    locales: ["fi"]
    keys: ["tac.legal.section3.body"]
    forbidden_target_regex: '\bkaikentietojen\b'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "fr-tac-account-freeze-plural"
    message: "French TAC external-payment copy must use grammatical account-freeze wording."
    locales: ["fr"]
    keys: ["tac.legal.section4.body"]
    forbidden_target_regex: 'des gel des comptes'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "ga-tac-custody-customs"
    message: "Irish TAC custody copy must not use 'custaim', which means customs/tariffs."
    locales: ["ga"]
    keys: ["tac.legal.section6.title", "tac.legal.section6.body"]
    forbidden_target_regex: '\bcustaim\b'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "ha-tac-compensation-computer"
    message: "Hausa TAC compensation copy must not use 'Kwamfuta', which means computer."
    locales: ["ha"]
    keys: ["tac.risk.noGuarantees.title"]
    forbidden_target_regex: '\bKwamfuta\b'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "mk-tac-central-entity-typo"
    message: "Macedonian TAC no-custody copy must spell the central entity term correctly."
    locales: ["mk"]
    keys: ["tac.legal.section6.body"]
    forbidden_target_regex: 'ентиет[аa]'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "sl-tac-contributors-noun"
    message: "Slovene TAC contributor references must use the contributor noun, not the contributions noun."
    locales: ["sl"]
    keys: ["tac.risk.p2p.body", "tac.legal.section3.body", "tac.legal.section5.body"]
    forbidden_target_regex: '\bprispevki\b'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "sr-tac-software-vulnerabilities"
    message: "Serbian TAC financial-risk copy must translate software vulnerabilities, not wounds."
    locales: ["sr"]
    keys: ["tac.risk.financial.body"]
    forbidden_target_regex: 'Ране у софтверу'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "th-tac-legal-representations"
    message: "Thai TAC warranty disclaimer must use legal representations wording, not casual expression wording."
    locales: ["th"]
    keys: ["tac.legal.section1.body"]
    forbidden_target_regex: 'การแสดงออก'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "yo-tac-risk-legal-headlines"
    message: "Yoruba TAC headlines must preserve risk and legal terminology."
    locales: ["yo"]
    keys: ["tac.risk.headline", "tac.legal.headline"]
    forbidden_target_regex: 'Mọ̀ àwọn Ẹ̀tọ́|Àwọn Ọ̀rọ̀ Ìṣèlú'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "af-trade-guide-without-justification"
    message: "Afrikaans trade-guide cancellation rule must say without justification, not without fairness."
    locales: ["af_ZA"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: 'sonder regverdigheid'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "ca-trade-guide-exchange-account-details"
    message: "Catalan trade-guide account-detail wording must mean exchange, not change."
    locales: ["ca"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: 'es canviïn els detalls del compte'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "fi-trade-guide-mediator-term"
    message: "Finnish Bisq Easy mediation guidance must use mediator terminology, not arbitrator terminology."
    locales: ["fi"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: '\bvälimies\b'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "fr-trade-guide-trader-term"
    message: "French Bisq Easy trade-guide copy must use trader terminology, not retail-merchant terminology."
    locales: ["fr"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: '\bcommerçants\b'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "ga-trade-guide-request-mediator"
    message: "Irish Bisq Easy trade-guide copy must request a mediator, not remind one."
    locales: ["ga"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: 'cuir i gcuimhne idirghabhálaí'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "hr-trade-guide-refund-term"
    message: "Croatian Bisq Easy mediation warning must use refund wording, not generic return wording."
    locales: ["hr"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: 'jamčiti povratak'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "ta-trade-guide-counterparty-term"
    message: "Tamil Bisq Easy trade-guide copy must use counterparty/trade-partner terminology, not trade brother."
    locales: ["ta"]
    keys: ["bisqEasy.tradeGuide.rules.content"]
    forbidden_target_regex: 'வர்த்தக சகோதரர்'
    severity: "error"
    source: "bisq2#4835 CodeRabbit"
  - id: "network-seed-node-not-seed-phrase"
    message: "On the Network connections screen 'Seed' labels a seed node (bootstrap peer), not a wallet recovery phrase; do not translate it as seed phrase/words."
    locales: ["cs", "es", "ru", "id", "it", "vi", "fr"]
    keys: ["mobile.networkInfo.connections.seed"]
    forbidden_target_regex: "(Slova|Frase|фраза|Kata|Parole|khóa|Récupération)"
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1606, #1669 CodeRabbit"
  - id: "network-transport-not-physical-transport"
    message: "On the Network screens 'Transport' is the network transport (e.g. Tor/clearnet), not physical transportation/shipping."
    locales: ["af_ZA", "cs", "vi"]
    keys: ["mobile.networkInfo.myNode.transport", "mobile.networkInfo.overview.transport"]
    forbidden_target_regex: "(Vervoer|Doprava|Vận chuyển)"
    regex_ignorecase: true
    severity: "error"
    source: "bisq-mobile#1606 CodeRabbit"
  - id: "no-vietnamese-horn-vowels-outside-vi"
    message: "Vietnamese horn vowels (ư/ơ and their tone-mark variants) must not appear outside the Vietnamese locale; they signal cross-language contamination such as the Yoruba 'dữdata' token that fused Vietnamese 'dữ' with English 'data'."
    locales: ["*"]
    excluded_locales: ["vi"]
    keys: ["*"]
    forbidden_target_regex: '[ưừứữửựƯỪỨỮỬỰơờớỡởợƠỜỚỠỞỢ]'
    severity: "error"
    source: "bisq2#4884 CodeRabbit"
