services:
  translator:
    # Use environment variables to make container and volume names unique per instance
    container_name: ${CONTAINER_NAME:-translator-service}
    build:
      context: .. # Build context is the project root
      dockerfile: docker/Dockerfile # Path to Dockerfile from project root
    init: true
    # The entrypoint is defined in the Dockerfile.
    # By default, run the main orchestration script. Can be overridden for debugging.
    command: ["/app/update-translations.sh"]
    volumes:
      # Mount the target repository into the container.
      # The logical name 'target-repo-data' is static. The actual volume name on the host
      # is set in the top-level 'volumes' section using the environment variable.
      - target-repo-data:/target_repo
      # Mount the selected project profile's configuration and glossary files.
      - type: bind
        source: ../profiles/${TRANSLATOR_PROFILE:-bisq}/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../profiles/${TRANSLATOR_PROFILE:-bisq}/glossary.json
        target: /app/glossary.json
        read_only: true
        bind:
          create_host_path: false
      # Mount logs directory (in project root) for persistence
      - ../logs:/app/logs
    # The container will start as root, and the entrypoint script will drop privileges to 'appuser'.
    # This allows the entrypoint to fix volume permissions before the main application runs.
    env_file:
      - .env
    environment:
      # Pass the absolute path of the config file inside the container to the application.
      # This makes the script's starting location irrelevant for finding its config.
      - TRANSLATOR_CONFIG_FILE=/app/config.yaml
      - GPG_BOT_KEY_PATH=/run/secrets/gpg_bot_key
      - DEPLOY_KEY_PATH=/run/secrets/deploy_key
    secrets:
      - source: gpg_bot_key
        target: gpg_bot_key
        mode: 0400
      - source: deploy_key
        target: deploy_key
        mode: 0400
    # Note: Place the .env file alongside this compose file (docker/.env)
    # with API keys and APPUSER_UID/GID.
    # An example is provided in docker/.env.example

# Define the named volume. The name used here is the default.
# The ${VOLUME_NAME} environment variable from .env will override the on-disk name.
volumes:
  target-repo-data:
    name: ${VOLUME_NAME:-target-repo-data}
    # Uncomment if volume is managed outside this compose project
    # external: true

# Define runtime secrets. The files are mounted read-only at /run/secrets/*
# and copied/imported by docker-entrypoint.sh during container startup.
secrets:
  gpg_bot_key:
    file: ${GPG_BOT_KEY_FILE:-../secrets/gpg_bot_key/bot_secret_key.asc}
  deploy_key:
    file: ${DEPLOY_KEY_FILE:-../secrets/deploy_key/id_ed25519}
