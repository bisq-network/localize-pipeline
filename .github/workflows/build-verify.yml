name: Build and Verify

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        # Pin to the major version tag for stability and to avoid invalid SHAs.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning # Fails on warnings or errors

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linters, scanners, and tests
        run: |
          original_cgroup_path="/sys/fs/cgroup$(awk -F: '$1 == "0" && $2 == "" { print $3 }' /proc/self/cgroup)"
          guardian_cgroup="/sys/fs/cgroup/localize-guardian-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$guardian_cgroup"
          sudo chown "$(id -u):$(id -g)" \
            "$guardian_cgroup" \
            "$guardian_cgroup/cgroup.procs"
          echo "$$" | sudo tee "$guardian_cgroup/cgroup.procs" >/dev/null
          export LOCALIZE_GUARDIAN_TEST_CGROUP="$guardian_cgroup"

          cleanup_guardian_cgroup() {
            set +e
            echo "$$" | sudo tee "$original_cgroup_path/cgroup.procs" >/dev/null
            echo 1 | sudo tee "$guardian_cgroup/cgroup.kill" >/dev/null || true
            sudo rmdir "$guardian_cgroup" || true
          }
          trap cleanup_guardian_cgroup EXIT

          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
          ruff check .
          pytest

      - name: Build and smoke-test package
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          localize --help

      - name: Set up Docker Buildx
        if: ${{ matrix.python-version == '3.11' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Create dummy secret files (for CI build only)
        if: ${{ matrix.python-version == '3.11' }}
        run: |
          # These files are required for the Docker build's COPY step to succeed.
          # They are empty and do not contain real secrets.
          mkdir -p secrets/gpg_bot_key
          touch secrets/gpg_bot_key/bot_public_key.asc
          touch secrets/gpg_bot_key/bot_secret_key.asc
          # The build process requires a .env file to be present, but the values are not
          # used in the CI environment. We create a dummy file to satisfy this requirement.
          echo "DUMMY_KEY=123" > docker/.env

      # QEMU not required unless building multi-arch
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Build Docker Image
        if: ${{ matrix.python-version == '3.11' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: translator-app:ci-${{ github.sha }}
          build-args: |
            SKIP_GPG_IMPORT=true
            SKIP_DEPLOY_KEY=true
            GPG_KEY_FINGERPRINT_FOR_TRUST=DUMMY_FINGERPRINT_FOR_CI

      - name: Display Docker Image Info
        if: ${{ matrix.python-version == '3.11' }}
        run: docker images

      - name: Run Trivy vulnerability scanner
        if: ${{ matrix.python-version == '3.11' }}
        run: |
          TRIVY_IMAGE="aquasec/trivy:0.69.2@sha256:3d1f862cb6c4fe13c1506f96f816096030d8d5ccdb2380a3069f7bf07daa86aa"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            "${TRIVY_IMAGE}" \
            image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --ignorefile /workspace/.trivyignore \
            --ignore-policy /workspace/.trivyignore.rego \
            "translator-app:ci-${{ github.sha }}"

      # - name: Upload Trivy scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: 'trivy-results.sarif' 

  build-and-verify:
    name: build-and-verify
    runs-on: ubuntu-latest
    needs: test-and-package
    if: ${{ always() }}

    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.test-and-package.result }}" != "success" ]; then
            echo "test-and-package matrix did not complete successfully"
            exit 1
          fi
